
apiVersion: recon.framework/v1

plugin:
  id: example
  name: Example Plugin
  version: 1.0.0
  category: test
  description: Example plugin producing structured observations

runtime:
  type: docker
  image: alpine:3.21
  command:
    - sh
    - -c
    - |
      printf '[{"type":"subdomain","value":"%s","metadata":{"status":"discovered"}}]\n' "$RECON_INPUT_MESSAGE"
  timeout: 30s

inputs:
  - name: message
    type: string
    required: true
    default: "api.example.com"

output:
  format: json
  source: stdout
